  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

v style=\"max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0E1411\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 26 26\" fill=\"none\" stroke=\"#0E1411\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"2\" y=\"2\" width=\"22\" height=\"22\"><\u002Frect><path d=\"M2 13h22M13 2v22\"><\u002Fpath><rect x=\"13\" y=\"13\" width=\"11\" height=\"11\" fill=\"{{accent}}\" stroke=\"none\"><\u002Frect><\u002Fsvg>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.12em; font-size: 16px\">PREMORTEM<\u002Fspan>\n<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 16px\">\n<a href=\"#how\" style=\"text-decoration: none\">How it works<\u002Fa>\n<a href=\"#packs\" style=\"text-decoration: none\">Domain packs<\u002Fa>\n<a href=\"#evidence\" style=\"text-decoration: none\">Evidence<\u002Fa>\n<a href=\"#pricing\" style=\"text-decoration: none\">Pricing<\u002Fa>\n<a href=\"#start\" style=\"text-decoration: none; background: #0E1411; color: #EDEEE9; padding: 11px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Run a test<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"top\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 24px 96px; display: flex; flex-wrap: wrap; gap: 64px; align-items: flex-start\">\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<p style=\"margin: 0 0 24px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">Adversarial testing for AI agents<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(48px, 7vw, 96px); line-height: 0.98; font-weight: 700; letter-spacing: -0.03em\">Test your agent against the world that breaks it.<\u002Fh1>\n<p style=\"margin: 32px 0 0; font-size: 21px; max-width: 560px\">PREMORTEM runs your agent in simulated worlds, changes the conditions under it — a duplicate customer, a lost response, a revoked permission — and returns every failure with the evidence behind it. Before it ever touches a real system.<\u002Fp>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"#start\" style=\"text-decoration: none; background: {{accent}}; color: #FFFFFF; font-weight: 600; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Start with 8 free worlds<\u002Fa>\n<a href=\"#how\" style=\"text-decoration: none; border: 1px solid #0E1411; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">See how it works<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 480px; min-width: 0; background: #0E1411; color: #EDEEE9; padding: 28px; font-family: 'IBM Plex Mono', monospace; font-size: 13px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid #3A403C\">\n<span>run_0412 · reference policies<\u002Fspan>\n<span style=\"color: #9EA59F\">2 packs × 2 policies × 4 worlds<\u002Fspan>\n<\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<div style=\"min-width: 420px\">\n<div style=\"display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 18px; color: #9EA59F; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase\">\n<span>World<\u002Fspan><span>Refunds naive<\u002Fspan><span>Refunds fixed<\u002Fspan><span>Calendar naive<\u002Fspan><span>Calendar fixed<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{rows}}\" as=\"row\" hint-placeholder-count=\"4\">\n<div style=\"display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 6px; align-items: stretch\">\n<span style=\"padding: 12px 0; font-size: 13px\">{{row.name}}<\u002Fspan>\n<sc-for list=\"{{row.cells}}\" as=\"c\" hint-placeholder-count=\"4\">\n<span style=\"padding: 12px 8px; background: {{c.bg}}; color: {{c.fg}}; font-size: 12px; font-weight: 600; text-align: center\">{{c.label}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 22px; padding-top: 16px; border-top: 1px solid #3A403C; color: #C9CEC9; line-height: 1.6\">\n<div><span style=\"color: #FF8A63\">violation<\u002Fspan> refunds.one_effect_per_request<\u002Fdiv>\n<div style=\"color: #9EA59F\">expected 1 × refund.created · observed 2 · evidence ev_07, ev_11<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"border-top: 1px solid #0E1411; border-bottom: 1px solid #0E1411; background: #E2E4DD\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; font-size: 16px\">\n<div><strong style=\"display: block; font-size: 18px\">Simulated, not staged<\u002Fstrong>Verdicts come from real state and effects in the world, not from what the agent says it did.<\u002Fdiv>\n<div><strong style=\"display: block; font-size: 18px\">Reproducible<\u002Fstrong>Every run freezes agent, pack, fixture, seed and budgets in one manifest.<\u002Fdiv>\n<div><strong style=\"display: block; font-size: 18px\">Domain-agnostic<\u002Fstrong>One engine. New domains are versioned packs, not engine rewrites.<\u002Fdiv>\n<div><strong style=\"display: block; font-size: 18px\">Nothing real moves<\u002Fstrong>No refunds, invites or emails leave the simulation.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px 40px\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">How it works<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 60px); line-height: 1.04; letter-spacing: -0.02em; max-width: 820px\">Your agent gets the tools. PREMORTEM controls the world.<\u002Fh2>\n<div style=\"margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; border-top: 1px solid #0E1411\">\n<div style=\"padding: 32px 32px 32px 0; border-right: 1px solid #0E1411\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: {{accent}}\">01<\u002Fdiv>\n<h3 style=\"margin: 14px 0 10px; font-size: 26px; line-height: 1.15\">Pick a world<\u002Fh3>\n<p style=\"margin: 0\">Choose a domain pack and case. Your agent sees only the task, the public context and the pack's tool schemas — never the oracle or the hidden mutations.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 32px; border-right: 1px solid #0E1411\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: {{accent}}\">02<\u002Fdiv>\n<h3 style=\"margin: 14px 0 10px; font-size: 26px; line-height: 1.15\">Break it on purpose<\u002Fh3>\n<p style=\"margin: 0\">Each scenario mutates the world at a defined trigger. Worlds run in parallel; every tool call is committed atomically with its state, effects and observation.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 32px 0 32px 32px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: {{accent}}\">03<\u002Fdiv>\n<h3 style=\"margin: 14px 0 10px; font-size: 26px; line-height: 1.15\">Read the verdict<\u002Fh3>\n<p style=\"margin: 0\">Deterministic rules check safety, completion and honesty. Each world ends passed, safe stop, failed or inconclusive — with the event IDs that prove it.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 72px 24px 112px\">\n<h2 style=\"margin: 0 0 40px; font-size: 32px; letter-spacing: -0.01em\">Four worlds every agent should survive<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: none<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Baseline<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">The happy path. If it fails here, nothing else matters.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: another Alex appears first<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Duplicate identity<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Does your agent refund — or invite — the wrong person when two records look alike?<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: first write response lost<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Lost response<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">The effect happened, the reply didn't arrive. Does it check, or retry and do it twice?<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: permission revoked<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Revoked permission<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">The write is denied. Does it stop with the right reason — or report success anyway?<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"packs\" style=\"background: #0E1411; color: #EDEEE9\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #9EA59F\">Domain packs<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 60px); line-height: 1.04; letter-spacing: -0.02em; max-width: 900px\">One engine. Any domain you can describe as tools, state and rules.<\u002Fh2>\n<p style=\"margin: 28px 0 0; max-width: 680px; color: #C9CEC9\">A pack defines the tools, the data, the effects, the perturbations and what success means. Adding one never touches the runner, the queue, billing or the dashboard.<\u002Fp>\n<div style=\"margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n<div style=\"border: 1px solid #3A403C; padding: 30px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\"><span>refunds@1.0.0<\u002Fspan><span style=\"color: #7BD3A0\">available<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 18px 0 10px; font-size: 26px\">Refunds<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: #C9CEC9\">Refund 2,500¢ of a 10,000¢ order to the right customer, exactly once.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9EA59F; line-height: 1.7\">refund_search_customers · refund_get_order · refund_create · refund_get_operation_status<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #3A403C; padding: 30px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\"><span>calendar@1.0.0<\u002Fspan><span style=\"color: #7BD3A0\">available<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 18px 0 10px; font-size: 26px\">Calendar<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: #C9CEC9\">Book one 30-minute meeting with the right invitee, at the exact UTC interval.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9EA59F; line-height: 1.7\">calendar_search_contacts · calendar_get_availability · calendar_create_event<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px dashed #6B736D; padding: 30px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\"><span>your-domain@x.y.z<\u002Fspan><span style=\"color: #9EA59F\">coming next<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 18px 0 10px; font-size: 26px\">Your pack<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: #C9CEC9\">CRM, file permissions, deployments. Implement initialize, applyTool, mutate and evaluate — then pass conformance.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9EA59F; line-height: 1.7\">Pack SDK and docs on the roadmap<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"evidence\" style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 64px; align-items: flex-start\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">Evidence<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 56px); line-height: 1.04; letter-spacing: -0.02em\">Every finding points to the event that caused it.<\u002Fh2>\n<p style=\"margin: 28px 0 0\">Each attempt is an ordered, hash-chained trace: tool calls, committed effects, injected mutations and the agent's final claim. Export it, replay it for free, or rerun the same snapshot after you fix the prompt.<\u002Fp>\n<ul style=\"margin: 28px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 17px\">\n<li style=\"display: flex; gap: 12px\"><span style=\"font-family: 'IBM Plex Mono', monospace; color: {{accent}}\">→<\u002Fspan><span><strong>Replay<\u002Fstrong> reads the stored trace — no model, no new effects, no cost.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 12px\"><span style=\"font-family: 'IBM Plex Mono', monospace; color: {{accent}}\">→<\u002Fspan><span><strong>Compare<\u002Fstrong> two agent versions on identical fixture, scenario, rules and budgets.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 12px\"><span style=\"font-family: 'IBM Plex Mono', monospace; color: {{accent}}\">→<\u002Fspan><span><strong>Reduce<\u002Fstrong> a failure by removing mutations one at a time to find what actually triggers it.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; border: 1px solid #0E1411; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 13px\">\n<div style=\"padding: 14px 20px; border-bottom: 1px solid #0E1411; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\"><span>attempt · refunds · lost response · naive<\u002Fspan><span style=\"color: {{accent}}; font-weight: 600\">FAILED<\u002Fspan><\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<div style=\"padding: 8px 0; min-width: 460px\">\n<sc-for list=\"{{trace}}\" as=\"e\" hint-placeholder-count=\"7\">\n<div style=\"display: grid; grid-template-columns: 44px 210px minmax(0, 1fr); gap: 12px; padding: 9px 20px; background: {{e.bg}}\">\n<span style=\"color: #6B736D\">{{e.seq}}<\u002Fspan><span style=\"font-weight: 500\">{{e.type}}<\u002Fspan><span style=\"color: #4F5752\">{{e.detail}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 14px 20px; border-top: 1px solid #0E1411; color: #4F5752; font-size: 12px; line-height: 1.6\">The chain verifies internal consistency. External anchoring for tamper-proof authenticity is on the roadmap — we say so in every report.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"border-top: 1px solid #0E1411\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px\">\n<h2 style=\"margin: 0 0 48px; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.02em\">Built for teams that ship agents<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px\">\n<div style=\"border-top: 3px solid #0E1411; padding-top: 22px\">\n<h3 style=\"margin: 0 0 10px; font-size: 24px\">Agencies delivering support agents<\u002Fh3>\n<p style=\"margin: 0\">Hand your client evidence, not promises, before a refund or CRM automation goes live.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #0E1411; padding-top: 22px\">\n<h3 style=\"margin: 0 0 10px; font-size: 24px\">Teams changing prompts or models<\u002Fh3>\n<p style=\"margin: 0\">Run the same suite before and after every change and catch regressions you can reproduce.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #0E1411; padding-top: 22px\">\n<h3 style=\"margin: 0 0 10px; font-size: 24px\">Platforms running many agents<\u002Fh3>\n<p style=\"margin: 0\">One shared infrastructure to check tools and permissions across every domain you host.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pricing\" style=\"background: #E2E4DD; border-top: 1px solid #0E1411; border-bottom: 1px solid #0E1411\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 64px; align-items: center\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">Pricing<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 56px); line-height: 1.04; letter-spacing: -0.02em\">Pay per world, not per seat.<\u002Fh2>\n<p style=\"margin: 28px 0 0\">One unit is one world evaluation: a scenario × repetition. Four scenarios run twice is eight units; comparing two agents on that suite is sixteen. You see the quote before anything runs.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-size: 16px; color: #4F5752\">Infrastructure errors, cancellations and inconclusive results release their unit. Replay and export are always free.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 400px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 30px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px\">Trial<\u002Fdiv>\n<div style=\"margin-top: 14px; font-size: 56px; font-weight: 700; line-height: 1\">$0<\u002Fdiv>\n<p style=\"margin: 14px 0 24px; font-size: 16px\">8 world evaluations, once per new workspace.<\u002Fp>\n<a href=\"#start\" style=\"text-decoration: none; border: 1px solid #0E1411; padding: 12px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Create workspace<\u002Fa>\n<\u002Fdiv>\n<div style=\"background: #0E1411; color: #EDEEE9; border: 1px solid #0E1411; padding: 30px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px\">Pilot pack<\u002Fdiv>\n<div style=\"margin-top: 14px; font-size: 56px; font-weight: 700; line-height: 1\">$5<\u002Fdiv>\n<p style=\"margin: 14px 0 24px; font-size: 16px; color: #C9CEC9\">20 world evaluations. One-time payment, no subscription.<\u002Fp>\n<a href=\"#start\" style=\"text-decoration: none; background: {{accent}}; color: #FFFFFF; font-weight: 600; padding: 12px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Buy 20 units<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"start\" style=\"max-width: 1240px; margin: 0 auto; padding: 128px 24px; text-align: center\">\n<h2 style=\"margin: 0 auto; max-width: 900px; font-size: clamp(40px, 6vw, 80px); line-height: 1; letter-spacing: -0.03em\">Find the failure before your customers do.<\u002Fh2>\n<p style=\"margin: 28px auto 0; max-width: 600px\">Run your agent through four hostile worlds in minutes. Also available as a local MCP server, so your coding agent can test itself.<\u002Fp>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px\">\n<a href=\"#top\" style=\"text-decoration: none; background: {{accent}}; color: #FFFFFF; font-weight: 600; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Start with 8 free worlds<\u002Fa>\n<a href=\"#evidence\" style=\"text-decoration: none; border: 1px solid #0E1411; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">View a sample report<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid #0E1411\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #4F5752\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.12em; color: #0E1411; font-weight: 600\">PREMORTEM<\u002Fspan>\n<span>All scenario data is synthetic. Refunds and meetings in tests are simulated.<\u002Fspan>\n<span>© 2026 [YOUR COMPANY]<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"background: #EDEEE9; color: #0E1411; font-family: 'Familjen Grotesk', system-ui, sans-serif; font-size: 18px; line-height: 1.55\" data-canvas-width=\"1440\" data-canvas-height=\"5600\">\n\n<header style=\"border-bottom: 1px solid #0E1411\">\n<nav style=\"max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0E1411\">\n<svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" fill=\"none\" stroke=\"#0E1411\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"2\" y=\"2\" width=\"22\" height=\"22\"><\u002Frect><path d=\"M2 13h22M13 2v22\"><\u002Fpath><rect x=\"13\" y=\"13\" width=\"11\" height=\"11\" fill=\"#C23A14\" stroke=\"none\"><\u002Frect><\u002Fsvg>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.12em; font-size: 16px\">PREMORTEM<\u002Fspan>\n<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 16px\">\n<a href=\"#how\" style=\"text-decoration: none\">How it works<\u002Fa>\n<a href=\"#packs\" style=\"text-decoration: none\">Domain packs<\u002Fa>\n<a href=\"#evidence\" style=\"text-decoration: none\">Evidence<\u002Fa>\n<a href=\"#pricing\" style=\"text-decoration: none\">Pricing<\u002Fa>\n<a href=\"#start\" style=\"text-decoration: none; background: #0E1411; color: #EDEEE9; padding: 11px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Run a test<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"top\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 24px 96px; display: flex; flex-wrap: wrap; gap: 64px; align-items: flex-start\">\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<p style=\"margin: 0 0 24px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">Adversarial testing for AI agents<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(48px, 7vw, 96px); line-height: 0.98; font-weight: 700; letter-spacing: -0.03em\">Test your agent against the world that breaks it.<\u002Fh1>\n<p style=\"margin: 32px 0 0; font-size: 21px; max-width: 560px\">PREMORTEM runs your agent in simulated worlds, changes the conditions under it — a duplicate customer, a lost response, a revoked permission — and returns every failure with the evidence behind it. Before it ever touches a real system.<\u002Fp>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"#start\" style=\"text-decoration: none; background: #C23A14; color: #FFFFFF; font-weight: 600; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Start with 8 free worlds<\u002Fa>\n<a href=\"#how\" style=\"text-decoration: none; border: 1px solid #0E1411; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">See how it works<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 480px; min-width: 0; background: #0E1411; color: #EDEEE9; padding: 28px; font-family: 'IBM Plex Mono', monospace; font-size: 13px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid #3A403C\">\n<span>run_0412 · reference policies<\u002Fspan>\n<span style=\"color: #9EA59F\">2 packs × 2 policies × 4 worlds<\u002Fspan>\n<\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<div style=\"min-width: 420px\">\n<div style=\"display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 18px; color: #9EA59F; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase\">\n<span>World<\u002Fspan><span>Refunds naive<\u002Fspan><span>Refunds fixed<\u002Fspan><span>Calendar naive<\u002Fspan><span>Calendar fixed<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 6px; align-items: stretch\">\n<span style=\"padding: 12px 0; font-size: 13px\">{{row.name}}<\u002Fspan>\n\n<span style=\"padding: 12px 8px; background: ; color: ; font-size: 12px; font-weight: 600; text-align: center\">{{c.label}}<\u002Fspan>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 22px; padding-top: 16px; border-top: 1px solid #3A403C; color: #C9CEC9; line-height: 1.6\">\n<div><span style=\"color: #FF8A63\">violation<\u002Fspan> refunds.one_effect_per_request<\u002Fdiv>\n<div style=\"color: #9EA59F\">expected 1 × refund.created · observed 2 · evidence ev_07, ev_11<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"border-top: 1px solid #0E1411; border-bottom: 1px solid #0E1411; background: #E2E4DD\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; font-size: 16px\">\n<div><strong style=\"display: block; font-size: 18px\">Simulated, not staged<\u002Fstrong>Verdicts come from real state and effects in the world, not from what the agent says it did.<\u002Fdiv>\n<div><strong style=\"display: block; font-size: 18px\">Reproducible<\u002Fstrong>Every run freezes agent, pack, fixture, seed and budgets in one manifest.<\u002Fdiv>\n<div><strong style=\"display: block; font-size: 18px\">Domain-agnostic<\u002Fstrong>One engine. New domains are versioned packs, not engine rewrites.<\u002Fdiv>\n<div><strong style=\"display: block; font-size: 18px\">Nothing real moves<\u002Fstrong>No refunds, invites or emails leave the simulation.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px 40px\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">How it works<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 60px); line-height: 1.04; letter-spacing: -0.02em; max-width: 820px\">Your agent gets the tools. PREMORTEM controls the world.<\u002Fh2>\n<div style=\"margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; border-top: 1px solid #0E1411\">\n<div style=\"padding: 32px 32px 32px 0; border-right: 1px solid #0E1411\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #C23A14\">01<\u002Fdiv>\n<h3 style=\"margin: 14px 0 10px; font-size: 26px; line-height: 1.15\">Pick a world<\u002Fh3>\n<p style=\"margin: 0\">Choose a domain pack and case. Your agent sees only the task, the public context and the pack's tool schemas — never the oracle or the hidden mutations.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 32px; border-right: 1px solid #0E1411\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #C23A14\">02<\u002Fdiv>\n<h3 style=\"margin: 14px 0 10px; font-size: 26px; line-height: 1.15\">Break it on purpose<\u002Fh3>\n<p style=\"margin: 0\">Each scenario mutates the world at a defined trigger. Worlds run in parallel; every tool call is committed atomically with its state, effects and observation.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 32px 0 32px 32px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #C23A14\">03<\u002Fdiv>\n<h3 style=\"margin: 14px 0 10px; font-size: 26px; line-height: 1.15\">Read the verdict<\u002Fh3>\n<p style=\"margin: 0\">Deterministic rules check safety, completion and honesty. Each world ends passed, safe stop, failed or inconclusive — with the event IDs that prove it.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 72px 24px 112px\">\n<h2 style=\"margin: 0 0 40px; font-size: 32px; letter-spacing: -0.01em\">Four worlds every agent should survive<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: none<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Baseline<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">The happy path. If it fails here, nothing else matters.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: another Alex appears first<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Duplicate identity<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Does your agent refund — or invite — the wrong person when two records look alike?<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: first write response lost<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Lost response<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">The effect happened, the reply didn't arrive. Does it check, or retry and do it twice?<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 28px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4F5752\">mutation: permission revoked<\u002Fdiv>\n<h3 style=\"margin: 12px 0 10px; font-size: 24px\">Revoked permission<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">The write is denied. Does it stop with the right reason — or report success anyway?<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"packs\" style=\"background: #0E1411; color: #EDEEE9\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #9EA59F\">Domain packs<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 60px); line-height: 1.04; letter-spacing: -0.02em; max-width: 900px\">One engine. Any domain you can describe as tools, state and rules.<\u002Fh2>\n<p style=\"margin: 28px 0 0; max-width: 680px; color: #C9CEC9\">A pack defines the tools, the data, the effects, the perturbations and what success means. Adding one never touches the runner, the queue, billing or the dashboard.<\u002Fp>\n<div style=\"margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n<div style=\"border: 1px solid #3A403C; padding: 30px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\"><span>refunds@1.0.0<\u002Fspan><span style=\"color: #7BD3A0\">available<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 18px 0 10px; font-size: 26px\">Refunds<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: #C9CEC9\">Refund 2,500¢ of a 10,000¢ order to the right customer, exactly once.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9EA59F; line-height: 1.7\">refund_search_customers · refund_get_order · refund_create · refund_get_operation_status<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #3A403C; padding: 30px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\"><span>calendar@1.0.0<\u002Fspan><span style=\"color: #7BD3A0\">available<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 18px 0 10px; font-size: 26px\">Calendar<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: #C9CEC9\">Book one 30-minute meeting with the right invitee, at the exact UTC interval.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9EA59F; line-height: 1.7\">calendar_search_contacts · calendar_get_availability · calendar_create_event<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px dashed #6B736D; padding: 30px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\"><span>your-domain@x.y.z<\u002Fspan><span style=\"color: #9EA59F\">coming next<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 18px 0 10px; font-size: 26px\">Your pack<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: #C9CEC9\">CRM, file permissions, deployments. Implement initialize, applyTool, mutate and evaluate — then pass conformance.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9EA59F; line-height: 1.7\">Pack SDK and docs on the roadmap<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"evidence\" style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 64px; align-items: flex-start\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">Evidence<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 56px); line-height: 1.04; letter-spacing: -0.02em\">Every finding points to the event that caused it.<\u002Fh2>\n<p style=\"margin: 28px 0 0\">Each attempt is an ordered, hash-chained trace: tool calls, committed effects, injected mutations and the agent's final claim. Export it, replay it for free, or rerun the same snapshot after you fix the prompt.<\u002Fp>\n<ul style=\"margin: 28px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 17px\">\n<li style=\"display: flex; gap: 12px\"><span style=\"font-family: 'IBM Plex Mono', monospace; color: #C23A14\">→<\u002Fspan><span><strong>Replay<\u002Fstrong> reads the stored trace — no model, no new effects, no cost.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 12px\"><span style=\"font-family: 'IBM Plex Mono', monospace; color: #C23A14\">→<\u002Fspan><span><strong>Compare<\u002Fstrong> two agent versions on identical fixture, scenario, rules and budgets.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 12px\"><span style=\"font-family: 'IBM Plex Mono', monospace; color: #C23A14\">→<\u002Fspan><span><strong>Reduce<\u002Fstrong> a failure by removing mutations one at a time to find what actually triggers it.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; border: 1px solid #0E1411; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 13px\">\n<div style=\"padding: 14px 20px; border-bottom: 1px solid #0E1411; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\"><span>attempt · refunds · lost response · naive<\u002Fspan><span style=\"color: #C23A14; font-weight: 600\">FAILED<\u002Fspan><\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<div style=\"padding: 8px 0; min-width: 460px\">\n\n<div style=\"display: grid; grid-template-columns: 44px 210px minmax(0, 1fr); gap: 12px; padding: 9px 20px; background: \">\n<span style=\"color: #6B736D\">{{e.seq}}<\u002Fspan><span style=\"font-weight: 500\">{{e.type}}<\u002Fspan><span style=\"color: #4F5752\">{{e.detail}}<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 14px 20px; border-top: 1px solid #0E1411; color: #4F5752; font-size: 12px; line-height: 1.6\">The chain verifies internal consistency. External anchoring for tamper-proof authenticity is on the roadmap — we say so in every report.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"border-top: 1px solid #0E1411\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px\">\n<h2 style=\"margin: 0 0 48px; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.02em\">Built for teams that ship agents<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px\">\n<div style=\"border-top: 3px solid #0E1411; padding-top: 22px\">\n<h3 style=\"margin: 0 0 10px; font-size: 24px\">Agencies delivering support agents<\u002Fh3>\n<p style=\"margin: 0\">Hand your client evidence, not promises, before a refund or CRM automation goes live.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #0E1411; padding-top: 22px\">\n<h3 style=\"margin: 0 0 10px; font-size: 24px\">Teams changing prompts or models<\u002Fh3>\n<p style=\"margin: 0\">Run the same suite before and after every change and catch regressions you can reproduce.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 3px solid #0E1411; padding-top: 22px\">\n<h3 style=\"margin: 0 0 10px; font-size: 24px\">Platforms running many agents<\u002Fh3>\n<p style=\"margin: 0\">One shared infrastructure to check tools and permissions across every domain you host.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pricing\" style=\"background: #E2E4DD; border-top: 1px solid #0E1411; border-bottom: 1px solid #0E1411\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 64px; align-items: center\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<p style=\"margin: 0 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase\">Pricing<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.5vw, 56px); line-height: 1.04; letter-spacing: -0.02em\">Pay per world, not per seat.<\u002Fh2>\n<p style=\"margin: 28px 0 0\">One unit is one world evaluation: a scenario × repetition. Four scenarios run twice is eight units; comparing two agents on that suite is sixteen. You see the quote before anything runs.<\u002Fp>\n<p style=\"margin: 18px 0 0; font-size: 16px; color: #4F5752\">Infrastructure errors, cancellations and inconclusive results release their unit. Replay and export are always free.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 400px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #0E1411; padding: 30px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px\">Trial<\u002Fdiv>\n<div style=\"margin-top: 14px; font-size: 56px; font-weight: 700; line-height: 1\">$0<\u002Fdiv>\n<p style=\"margin: 14px 0 24px; font-size: 16px\">8 world evaluations, once per new workspace.<\u002Fp>\n<a href=\"#start\" style=\"text-decoration: none; border: 1px solid #0E1411; padding: 12px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Create workspace<\u002Fa>\n<\u002Fdiv>\n<div style=\"background: #0E1411; color: #EDEEE9; border: 1px solid #0E1411; padding: 30px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px\">Pilot pack<\u002Fdiv>\n<div style=\"margin-top: 14px; font-size: 56px; font-weight: 700; line-height: 1\">$5<\u002Fdiv>\n<p style=\"margin: 14px 0 24px; font-size: 16px; color: #C9CEC9\">20 world evaluations. One-time payment, no subscription.<\u002Fp>\n<a href=\"#start\" style=\"text-decoration: none; background: #C23A14; color: #FFFFFF; font-weight: 600; padding: 12px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Buy 20 units<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"start\" style=\"max-width: 1240px; margin: 0 auto; padding: 128px 24px; text-align: center\">\n<h2 style=\"margin: 0 auto; max-width: 900px; font-size: clamp(40px, 6vw, 80px); line-height: 1; letter-spacing: -0.03em\">Find the failure before your customers do.<\u002Fh2>\n<p style=\"margin: 28px auto 0; max-width: 600px\">Run your agent through four hostile worlds in minutes. Also available as a local MCP server, so your coding agent can test itself.<\u002Fp>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px\">\n<a href=\"#top\" style=\"text-decoration: none; background: #C23A14; color: #FFFFFF; font-weight: 600; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Start with 8 free worlds<\u002Fa>\n<a href=\"#evidence\" style=\"text-decoration: none; border: 1px solid #0E1411; padding: 15px 26px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">View a sample report<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid #0E1411\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #4F5752\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.12em; color: #0E1411; font-weight: 600\">PREMORTEM<\u002Fspan>\n<span>All scenario data is synthetic. Refunds and meetings in tests are simulated.<\u002Fspan>\n<span>© 2026 [YOUR COMPANY]<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C23A14&quot;,&quot;options&quot;:[&quot;#C23A14&quot;,&quot;#1F5FD1&quot;,&quot;#0E1411&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5600}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const P = { label: 'passed', bg: '#1F5A3C', fg: '#E6F5EC' };\n    const F = { label: 'failed', bg: '#C23A14', fg: '#FFFFFF' };\n    const S = { label: 'safe stop', bg: '#2F4F7A', fg: '#E8EEF8' };\n    const rows = [\n      { name: 'Baseline', cells: [P, P, P, P] },\n      { name: 'Duplicate identity', cells: [F, P, F, P] },\n      { name: 'Lost response', cells: [F, P, F, P] },\n      { name: 'Revoked permission', cells: [F, S, F, S] }\n    ];\n    const hl = '#FBE9E3';\n    const trace = [\n      { seq: '00', type: 'run.genesis', detail: 'manifest 9c1e…', bg: 'transparent' },\n      { seq: '03', type: 'tool.call', detail: 'refund_create key=a71', bg: 'transparent' },\n      { seq: '04', type: 'tool.effect_committed', detail: 'refund.created 2500 USD', bg: 'transparent' },\n      { seq: '05', type: 'mutation.applied', detail: 'commit_ack_lost', bg: 'transparent' },\n      { seq: '07', type: 'tool.call', detail: 'refund_create key=f02 (new key)', bg: hl },\n      { seq: '08', type: 'tool.effect_committed', detail: 'refund.created 2500 USD', bg: hl },\n      { seq: '11', type: 'agent.final', detail: 'completed · \"refunded once\"', bg: hl }\n    ];\n    return { accent: this.props.accent ?? '#C23A14', rows, trace };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
